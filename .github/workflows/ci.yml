name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  php:
    name: PHP ${{ matrix.php }}
    strategy:
      fail-fast: false
      matrix: {php: ['8.1.29', '8.2', '8.3']}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', tools: composer:v2, coverage: none}
      - run: find LimeControlJsonQuestions tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/model.php
      - uses: actions/checkout@v4
        if: matrix.php == '8.3'
        with:
          repository: LimeSurvey/LimeSurvey
          ref: a4a39361bd5ca1afefb85b4726d9d179ae4bad7c
          path: upstream
          persist-credentials: false
      - if: matrix.php == '8.3'
        run: composer install --no-interaction --prefer-dist && python3 scripts/analyse.py upstream
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci && npx playwright install --with-deps chromium
      - run: python3 scripts/package.py && python3 scripts/package.py --verify
      - run: unzip -q dist/LimeControlJsonQuestions-*.zip -d "$RUNNER_TEMP/lcjq-zip"
      - run: node tests/respondent.browser.cjs && node tests/respondent.parity.cjs
        env:
          LCJQ_ASSETS: ${{ runner.temp }}/lcjq-zip/LimeControlJsonQuestions/assets
      - uses: actions/upload-artifact@v4
        with: {name: candidate-packages, path: dist, if-no-files-found: error}
  integration:
    needs: bundle
    uses: ./.github/workflows/qualify.yml
    with: {artifact: candidate-packages}
  ready:
    name: Release checks
    if: always()
    needs: [php, bundle, integration]
    runs-on: ubuntu-latest
    steps:
      - env:
          PHP_RESULT: ${{ needs.php.result }}
          BUNDLE_RESULT: ${{ needs.bundle.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: test "$PHP_RESULT/$BUNDLE_RESULT/$INTEGRATION_RESULT" = success/success/success
